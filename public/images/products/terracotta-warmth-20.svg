<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="tileGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#c4a882" />
  <!-- Herringbone angled patterns -->
  <g filter="url(#shadow)">
    <rect x="60" y="40" width="120" height="240" rx="4" fill="#b8613b" transform="rotate(45 120 160)" />
    <rect x="60" y="40" width="120" height="240" rx="4" fill="url(#tileGlow)" transform="rotate(45 120 160)" />
    
    <rect x="230" y="40" width="120" height="240" rx="4" fill="#b8613b" transform="rotate(-45 290 160)" />
    <rect x="230" y="40" width="120" height="240" rx="4" fill="url(#tileGlow)" transform="rotate(-45 290 160)" />

    <rect x="60" y="320" width="120" height="240" rx="4" fill="#b8613b" transform="rotate(-45 120 440)" />
    <rect x="60" y="320" width="120" height="240" rx="4" fill="url(#tileGlow)" transform="rotate(-45 120 440)" />

    <rect x="230" y="320" width="120" height="240" rx="4" fill="#b8613b" transform="rotate(45 290 440)" />
    <rect x="230" y="320" width="120" height="240" rx="4" fill="url(#tileGlow)" transform="rotate(45 290 440)" />

    <rect x="400" y="180" width="120" height="240" rx="4" fill="#b8613b" transform="rotate(45 460 300)" />
    <rect x="400" y="180" width="120" height="240" rx="4" fill="url(#tileGlow)" transform="rotate(45 460 300)" />
  </g>
  <!-- Subtle specular gloss sweep -->
  <rect x="0" y="0" width="600" height="600" fill="url(#tileGlow)" opacity="0.4" pointer-events="none" />
</svg>