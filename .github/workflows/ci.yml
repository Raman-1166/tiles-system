name: CI

on:
  push:
    branches: [main, industry-ready]
  pull_request:
    branches: [main, industry-ready]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_db
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_db_test
      ADMIN_PASSWORD: changeme_in_production
      ADMIN_SESSION_SECRET: ci-secret-change-to-32-chars-random-hex
      ORDER_TOKEN_SECRET: ci-order-token-secret-32-chars-hex-ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report dependency audit
        run: npm audit --omit=dev || true

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Setup database migrations & seed
        run: |
          npm run db:push
          npm run db:seed
          npm run db:test:setup

      - name: Build Next.js application
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
