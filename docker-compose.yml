services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clay-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://app_user:app_password@db:3306/app_db
      - ADMIN_SESSION_SECRET=production-admin-session-secret-change-me-32chars
      - ORDER_TOKEN_SECRET=production-order-token-secret-change-me-32chars
      - PAYMENT_PROVIDER=mock
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - clay-network

  db:
    image: mysql:8.0.43
    container_name: clay-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_secure_password
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app_user", "-papp_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clay-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: clay-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI to inspect transactional order emails
      - "1025:1025" # SMTP port
    networks:
      - clay-network

volumes:
  mysql_data:
    driver: local

networks:
  clay-network:
    driver: bridge
